# NOTE: This CI workflow is parked here because the automated push
# credentials lack the GitHub `workflow` OAuth scope, which is required to
# create or update files under .github/workflows/.
#
# To activate CI, move it into place with your own credentials:
#   mkdir -p .github/workflows
#   git mv infra/ci/github-ci.yml .github/workflows/ci.yml
#   git commit -m "Activate CI workflow" && git push
# (or add the file via the GitHub web UI / a workflow-scoped token)

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend tests (unit, property, determinism, integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest tests -q
      - name: Smoke run (seed-42 determinism gate)
        run: python scripts/smoke.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
